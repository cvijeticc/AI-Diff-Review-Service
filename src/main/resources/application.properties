spring.application.name=diff-review-service
server.port=${PORT:8080}

# Service self-declaration (must match actual behavior; see /spec)
app.version=1.0.0
app.auth-token=${AUTH_TOKEN:dev-only-token}
app.max-payload-bytes=1048576
app.chunk-bytes=65536
app.max-concurrent-jobs=4
app.rate-limit-per-minute=30

# Artificial per-job processing delay in ms; 0 in production.
# Used by tests to make concurrency and live SSE streaming observable.
app.mock-delay-ms=${MOCK_DELAY_MS:0}

# llm provider - credentials live only on the server, never sent by clients
app.llm.api-key=${ANTHROPIC_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:https://api.anthropic.com}
app.llm.model=${LLM_MODEL:claude-sonnet-5}
app.llm.timeout-ms=${LLM_TIMEOUT_MS:20000}
