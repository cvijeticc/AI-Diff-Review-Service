spring.application.name=diff-review-service
server.port=${PORT:8080}

# Service self-declaration (must match actual behavior; see /spec).
# The version is filtered in from <version> in pom.xml at build time -
# spring-boot-starter-parent already filters application*.properties with
# @...@ delimiters - so /health can never drift from the deployed commit.
app.version=@project.version@
app.auth-token=${AUTH_TOKEN:dev-only-token}
app.max-payload-bytes=1048576
app.chunk-bytes=65536
app.max-concurrent-jobs=4
# Sustained submissions/minute that are guaranteed to succeed, and the
# declared allowance for arriving faster than that (token bucket capacity).
app.rate-limit-per-minute=30
app.rate-limit-burst=60

# llm calls get their own pool so a slow model can never starve mock jobs.
app.max-concurrent-llm-jobs=4

# Retention for jobs/cache/idempotency keys. Bounded so the maps cannot grow
# without limit; sized well past the scoring window.
app.job-ttl-seconds=86400
# Idempotency keys and cached findings outlive the jobs they refer to, so a
# replay with a *different* body still conflicts instead of quietly starting
# new work. They are also a fraction of the size of a job.
app.key-ttl-seconds=604800
app.max-retained-jobs=10000

# Artificial per-job processing delay in ms; 0 in production.
# Used by tests to make concurrency and live SSE streaming observable.
app.mock-delay-ms=${MOCK_DELAY_MS:0}

# llm provider - credentials live only on the server, never sent by clients.
# The base URL is a real lever: /v1/chat/completions is the shape gateways and
# local runtimes implement, so this can point somewhere other than OpenAI
# without a code change.
app.llm.api-key=${OPENAI_API_KEY:}
app.llm.base-url=${LLM_BASE_URL:https://api.openai.com}
app.llm.model=${LLM_MODEL:gpt-5-mini}
# 60s, not 20s: gpt-5-mini is a reasoning model, so its reasoning phase runs
# before the first output token and one call routinely passes 20 seconds.
app.llm.timeout-ms=${LLM_TIMEOUT_MS:60000}
app.llm.max-tokens=${LLM_MAX_TOKENS:16000}

# Every non-2xx response must carry the contract's error envelope, including
# the ones Spring renders itself (see ApiErrorController).
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
