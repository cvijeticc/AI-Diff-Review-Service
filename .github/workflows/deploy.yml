name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys race on the VPS.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn verify
        run: ./mvnw -B --no-transfer-progress verify

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Write SSH key and pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY" || { echo "::error::secret VPS_SSH_KEY is missing"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "::error::secret VPS_KNOWN_HOSTS is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key is pinned via secret - no ssh-keyscan TOFU on every run.
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy commit ${{ github.sha }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "::error::secret VPS_HOST is missing"; exit 1; }
          test -n "$VPS_USER" || { echo "::error::secret VPS_USER is missing"; exit 1; }
          # The key on the server is a forced-command key: it can only run
          # deploy.sh. The SHA below arrives as SSH_ORIGINAL_COMMAND and is
          # validated server-side, so this deploys exactly the tested commit.
          ssh -i ~/.ssh/deploy_key \
              -p "${VPS_PORT:-22}" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              "$VPS_USER@$VPS_HOST" "${{ github.sha }}"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
